name: CI

# Manual only: start it from the Actions tab or with `gh workflow run CI`.
on:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests + integration tests (Testcontainers starts MySQL in Docker).
      - name: Build and test
        run: mvn -B -ntp verify
