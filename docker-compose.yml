services:
  mysql:
    image: mysql:8.0
    container_name: sqlens-mysql
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # Bind to loopback only so the database is never reachable from the network.
      - "127.0.0.1:${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/sakila-db/sakila-schema.sql:/docker-entrypoint-initdb.d/01-sakila-schema.sql:ro
      - ./db/sakila-db/sakila-data.sql:/docker-entrypoint-initdb.d/02-sakila-data.sql:ro
      - ./docker/initdb/03-readonly-user.sh:/docker-entrypoint-initdb.d/03-readonly-user.sh:ro
    healthcheck:
      # Password passed via MYSQL_PWD so it does not show up in the process list.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
